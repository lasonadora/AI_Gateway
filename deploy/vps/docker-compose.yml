# VPS 部署（阿里云轻量 / Vultr / 任意 Ubuntu 机器）
# 两个容器：openclaw（我们的镜像）+ caddy（自动 HTTPS，反代到 Gateway）
# 用法见 setup.sh；更新：cd /opt/ai_gateway && git pull && docker compose -f deploy/vps/docker-compose.yml up -d --build
services:
  openclaw:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "18789"
      OPENCLAW_PUBLIC_ORIGIN: "https://${PUBLIC_HOST}"
      OPENCLAW_TRUSTED_PROXIES: "172.30.0.10"   # caddy 的固定 IP（下面）
    volumes:
      - openclaw_data:/home/node/.openclaw
    expose:
      - "18789"
    # 2 GiB 小机器：给容器封顶，宁可容器被杀重启，也别把宿主机（sshd、云助手）一起拖死
    deploy:
      resources:
        limits:
          memory: 1400M
    # 不要在这台机器上并行跑 `docker compose exec openclaw openclaw ...`：
    # CLI 会再起一整套运行时，2 GiB 扛不住（踩过一次，机器直接失联）。

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      - openclaw

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  openclaw_data:
  caddy_data:
  caddy_config:
