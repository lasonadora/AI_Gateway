# VPS 部署（阿里云轻量 / Vultr / 任意 Ubuntu 机器）
# 两个容器：openclaw（我们的镜像）+ caddy（自动 HTTPS，反代到 Gateway）
# 用法见 setup.sh；更新：cd /opt/ai_gateway && git pull && docker compose -f deploy/vps/docker-compose.yml up -d --build
services:
  openclaw:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "18789"
      OPENCLAW_PUBLIC_ORIGIN: "https://${PUBLIC_HOST}"
      OPENCLAW_TRUSTED_PROXIES: "172.30.0.10"   # caddy 的固定 IP（下面）
    volumes:
      - openclaw_data:/home/node/.openclaw
    expose:
      - "18789"
    # 给容器封顶，宁可容器被杀重启，也别把宿主机（sshd、云助手）一起拖死。
    # 机器是 4 GiB：留 1 GiB 给系统，容器最多 3 GiB；memswap 和 memory 相等 = 容器不许用 swap，
    # 超了直接 OOM 重启，不会像 2 GiB 时那样换页把整台机器冻住 90 秒。
    deploy:
      resources:
        limits:
          memory: 3000M
    memswap_limit: 3000M
    # 网关空载约 1 GiB，开会话再加 agent 运行时 + Notion MCP。2 GiB 的机器跑不动（踩过）。

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      - openclaw

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  openclaw_data:
  caddy_data:
  caddy_config:
