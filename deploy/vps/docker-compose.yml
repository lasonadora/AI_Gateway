# VPS 部署（Vultr / DigitalOcean / 任意 Ubuntu 机器）
# 两个容器：openclaw（我们的镜像）+ caddy（自动 HTTPS，反代到 Gateway）
# 用法见 setup.sh；更新：cd /opt/ai_gateway && git pull && docker compose -f deploy/vps/docker-compose.yml up -d --build
services:
  openclaw:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "18789"
      OPENCLAW_PUBLIC_ORIGIN: "https://${PUBLIC_HOST}"
    volumes:
      - openclaw_data:/home/node/.openclaw
    expose:
      - "18789"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - openclaw

volumes:
  openclaw_data:
  caddy_data:
  caddy_config:
