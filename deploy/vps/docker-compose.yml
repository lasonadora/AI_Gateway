# VPS 部署（阿里云轻量 / Vultr / 任意 Ubuntu 机器）
# 两个容器：openclaw（我们的镜像）+ caddy（自动 HTTPS，反代到 Gateway）
# 用法见 setup.sh；更新：cd /opt/ai_gateway && git pull && docker compose -f deploy/vps/docker-compose.yml up -d --build
services:
  openclaw:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # 网关优雅退出要几十秒；Docker 默认只等 10 秒就 kill，会把 agent 的 sqlite 弄坏（启动报 "run openclaw doctor --fix"）。
    stop_grace_period: 90s
    # 官方镜像自带的 healthcheck 会把整套配置模块 import 一遍，这台机器上 10 秒内跑不完，老是误报 unhealthy。
    # 换成轻量 HTTP 探活：网关的 HTTP 口能返回就算活着。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 180s
    env_file: .env
    environment:
      PORT: "18789"
      OPENCLAW_PUBLIC_ORIGIN: "https://${PUBLIC_HOST}"
      OPENCLAW_TRUSTED_PROXIES: "172.30.0.10"   # caddy 的固定 IP（下面）
    volumes:
      - openclaw_data:/home/node/.openclaw
    expose:
      - "18789"
    # 给容器封顶，宁可容器被杀重启，也别把宿主机（sshd、云助手）一起拖死。
    # 机器是 4 GiB：留 1 GiB 给系统，容器最多 3 GiB；memswap 和 memory 相等 = 容器不许用 swap，
    # 超了直接 OOM 重启，不会像 2 GiB 时那样换页把整台机器冻住 90 秒。
    deploy:
      resources:
        limits:
          memory: 3000M
    memswap_limit: 3000M
    # 网关空载约 1 GiB，开会话再加 agent 运行时 + Notion MCP。2 GiB 的机器跑不动（踩过）。

  ingest:
    build:
      context: ../..
      dockerfile: ingest/Dockerfile
    restart: unless-stopped
    env_file: .env            # 用到 NOTION_TOKEN / ANTHROPIC_API_KEY / INGEST_TOKEN
    environment:
      PORT: "8787"
      NOTION_DAILY_DATA_SOURCE_ID: "9ffc0fca-38de-4711-a83d-d0046349e249"
      NOTION_LOG_DATA_SOURCE_ID: "17dca1b3-1334-4082-ae85-8cb1de5e5978"
      NOTION_REPORT_DATA_SOURCE_ID: "94401eb4-de13-4cb8-9cc4-c840fc66fdb8"
      VISION_MODEL: "claude-sonnet-5-5"     # 看图留 Sonnet（一天 3 张，几分钱）
      REPORT_MODEL: "${REPORT_MODEL:-claude-sonnet-5-5}"   # 日报文字 + 市场/新闻；想省就在 .env 里设 REPORT_MODEL=claude-haiku-5-5
      REPORT_TIME: "${REPORT_TIME:-21:30}"   # 每天几点出日报（本地时间）；BARK_KEY 在 .env 里（可选，手机推送）
      BRIEF_TICKERS: "${BRIEF_TICKERS:-TSLA,SPCX,ASML,QQQ}"   # 日报里的市场小节；设成空字符串关闭
      BRIEF_MAX_CHARS: "${BRIEF_MAX_CHARS:-500}"
      PHOTO_DIR: /data/photos
      TZ: "${OPENCLAW_TZ:-Asia/Shanghai}"
    volumes:
      - ingest_data:/data       # 原图 + log.jsonl，全部留档
    expose:
      - "8787"
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      - openclaw
      - ingest

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  openclaw_data:
  ingest_data:
  caddy_data:
  caddy_config:
